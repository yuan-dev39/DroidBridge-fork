name: Dynamic MCP Registry CI

on:
  push:
    branches:
      - feature/dynamic-mcp-registry
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-mcp-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format Rust sources
        working-directory: rust
        run: cargo fmt --all
      - name: Run workspace tests
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Commit rustfmt changes
        if: success() && github.event_name == 'push'
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rust
            git commit -m "style: rustfmt dynamic MCP registry [skip ci]"
            git push origin "HEAD:${GITHUB_REF}"
          fi

  android:
    name: Build Android debug Magisk module
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build debug root module and frontend APK
        run: ./gradlew :root-frontend:assembleDebugMagiskModule --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: droidbridge-debug-magisk-module
          path: root-frontend/build/outputs/magisk/droidbridge-debug-magisk.zip
          if-no-files-found: error
          retention-days: 14
