name: Dynamic MCP Registry CI

on:
  push:
    branches:
      - feature/dynamic-mcp-registry
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-mcp-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format Rust sources
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        working-directory: rust
        run: cargo test --workspace --locked

  android:
    name: Build Root module and Shizuku APK editions
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"
          sdkmanager --install "platforms;android-37.0"
          # SDK Manager publishes API 37 under android-37.0, while this project's
          # AGP and framework helper task resolve the canonical android-37 path.
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
      - name: Install libpcap build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison
      - name: Build pinned Android libpcap
        run: bash tools/build-libpcap.sh
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Root edition artifacts
        run: |
          bash ./gradlew \
            :root-frontend:assembleDebugMagiskModule \
            :root-frontend:assembleStableMagiskModule \
            --no-daemon
      - name: Run Android unit tests
        run: |
          bash ./gradlew \
            :root-frontend:testDebugUnitTest \
            :standalone:testDebugUnitTest \
            --no-daemon
      - name: Build standalone Shizuku APK
        run: bash ./gradlew :standalone:packageShizukuDebugApk --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: droidbridge-root-debug-module
          path: root-frontend/build/outputs/magisk/droidbridge-debug-magisk.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: droidbridge-root-stable-module
          path: root-frontend/build/outputs/magisk/droidbridge-stable-magisk.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: droidbridge-shizuku-debug-apk
          path: standalone/build/outputs/distributions/DroidBridge-Shizuku-debug.apk
          if-no-files-found: error
          retention-days: 14
