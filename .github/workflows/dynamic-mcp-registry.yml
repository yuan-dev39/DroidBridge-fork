name: Dynamic MCP Registry CI

on:
  push:
    branches:
      - feature/dynamic-mcp-registry
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-mcp-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format Rust sources
        working-directory: rust
        run: cargo fmt --all
      - name: Run workspace tests
        working-directory: rust
        run: cargo test --workspace --locked

