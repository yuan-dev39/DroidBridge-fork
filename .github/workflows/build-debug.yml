name: Build installable debug packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Shizuku APK and Root Magisk module
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and install Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) { $sdkRoot = "C:\Android\android-sdk" }
          $sdkManager = Get-ChildItem (Join-Path $sdkRoot "cmdline-tools") -Filter "sdkmanager.bat" -Recurse |
            Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $sdkManager) { throw "Android SDK command-line tools not found under $sdkRoot" }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          1..100 | ForEach-Object { "y" } | & $sdkManager.FullName --licenses
          if ($LASTEXITCODE -ne 0) { throw "Android SDK license acceptance failed" }
          & $sdkManager.FullName --install "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;29.0.14206865"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        shell: pwsh
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android 37 platform path for AGP
        shell: pwsh
        run: |
          # Android publishes API 37 as android-37.0, while AGP resolves compileSdk 37
          # through the canonical android-37 directory. A junction preserves the original
          # platform files and satisfies AGP without modifying project compileSdk settings.
          $platforms = Join-Path $env:ANDROID_SDK_ROOT "platforms"
          $platform37 = Join-Path $platforms "android-37.0"
          $canonical37 = Join-Path $platforms "android-37"
          if (!(Test-Path (Join-Path $platform37 "android.jar"))) {
            throw "Android 37.0 platform was not installed correctly"
          }
          if (!(Test-Path $canonical37)) {
            New-Item -ItemType Junction -Path $canonical37 -Target $platform37 | Out-Null
          }
          if (!(Test-Path (Join-Path $canonical37 "android.jar"))) {
            throw "Android 37 canonical platform path is not usable"
          }

      - name: Build pinned Android libpcap static dependency
        shell: pwsh
        run: |
          $sdkPath = $env:ANDROID_SDK_ROOT.Replace("\\", "\\\\")
          "sdk.dir=$sdkPath" | Out-File -FilePath local.properties -Encoding ascii
          ./tools/build-libpcap.ps1 -CacheRoot build/i0-cache
\n      - name: Build standalone Shizuku APK and Root debug module
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon --dependency-verification=off :standalone:testDebugUnitTest :standalone:assembleDebug :root-frontend:assembleDebugMagiskModule

      - name: Verify package outputs
        shell: pwsh
        run: |
          $apk = "standalone/build/outputs/apk/debug/standalone-debug.apk"
          $module = "root-frontend/build/outputs/magisk/droidbridge-debug-magisk.zip"
          if (!(Test-Path $apk)) { throw "Missing Shizuku debug APK: $apk" }
          if (!(Test-Path $module)) { throw "Missing Root Magisk module: $module" }
          Copy-Item $apk "droidbridge-shizuku-debug.apk"
          Copy-Item $module "droidbridge-root-debug-magisk.zip"
          Get-FileHash "droidbridge-shizuku-debug.apk" -Algorithm SHA256 | Format-List | Out-File SHA256SUMS.txt
          Get-FileHash "droidbridge-root-debug-magisk.zip" -Algorithm SHA256 | Format-List | Out-File -Append SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: droidbridge-debug-installers
          path: |
            droidbridge-shizuku-debug.apk
            droidbridge-root-debug-magisk.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
