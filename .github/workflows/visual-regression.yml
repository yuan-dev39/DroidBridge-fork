name: DroidBridge visual regression

on:
  push:
    branches:
      - fix/shizuku-shell-identity-visual-swipe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run visual integration tests
        working-directory: rust
        run: cargo test -p runtime --test i8_vis
      - name: Run command identity regression tests
        working-directory: rust
        run: cargo test -p runtime --test i8_cmd
      - name: Compile and test App native execution
        working-directory: rust
        run: cargo test -p app_native
      - name: Compile and test Magisk daemon execution
        working-directory: rust
        run: cargo test -p daemon

  android-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compile platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile standalone Kotlin sources
        run: |
          # API 37 is not published in the runner's SDK repository yet. Compile the
          # Kotlin source against the latest available stable platform without
          # changing the checked-in product SDK settings.
          sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' standalone/build.gradle.kts
          ./gradlew :standalone:compileDebugKotlin
