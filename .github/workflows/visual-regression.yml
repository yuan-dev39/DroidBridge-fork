name: DroidBridge visual regression

on:
  push:
    branches:
      - fix/shizuku-shell-identity-visual-swipe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run visual integration tests
        working-directory: rust
        run: cargo test -p runtime --test i8_vis
