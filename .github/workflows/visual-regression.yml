name: DroidBridge visual regression

on:
  push:
    branches:
      - fix/shizuku-shell-identity-visual-swipe
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run visual integration tests
        working-directory: rust
        run: cargo test -p runtime --test i8_vis
      - name: Run command identity regression tests
        working-directory: rust
        run: cargo test -p runtime --test i8_cmd
      - name: Compile and test App native execution
        working-directory: rust
        run: cargo test -p app_native
      - name: Compile and test Magisk daemon execution
        working-directory: rust
        run: cargo test -p daemon

  android-kotlin-verification-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compile platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Install cargo-ndk required by the Android Gradle native build
        run: cargo install cargo-ndk --locked
      - name: Generate reviewable Gradle verification metadata and compile Kotlin
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' standalone/build.gradle.kts
          chmod +x ./gradlew
          ./gradlew --write-verification-metadata sha256 :standalone:compileDebugKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-verification-metadata-review
          path: gradle/verification-metadata.xml
          if-no-files-found: error

  android-rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check Android native executors
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a check --locked -p app_native -p daemon
