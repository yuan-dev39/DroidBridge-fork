name: Validate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [feature/dynamic-mcp-registry-debug]

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        working-directory: rust
        run: cargo test --workspace --locked

  android-ui:
    name: Android UI compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared UI tests and Root frontend Kotlin compile
        run: ./gradlew --no-daemon :ui-common:testDebugUnitTest :root-frontend:compileDebugKotlin
